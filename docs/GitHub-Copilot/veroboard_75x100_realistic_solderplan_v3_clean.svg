<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1160" viewBox="0 0 1800 1160">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2f4f8"/>
      <stop offset="100%" stop-color="#e3e8f0"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2e3bd"/>
      <stop offset="100%" stop-color="#e3cd9b"/>
    </linearGradient>
    <linearGradient id="mod" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#245792"/>
      <stop offset="100%" stop-color="#1a3f6b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
    <pattern id="holes" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="none"/>
      <circle cx="12" cy="12" r="3.1" fill="#fbf8f0" stroke="#8a6b40" stroke-width="0.65"/>
    </pattern>
    <pattern id="strips" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="none"/>
      <rect x="0" y="10" width="24" height="4" fill="#b07d4f" fill-opacity="0.52"/>
    </pattern>
    <style>
      .h1 { font: 700 34px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .h2 { font: 500 16px 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .h3 { font: 700 16px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .txt { font: 600 13px 'Segoe UI', Arial, sans-serif; fill: #1f2937; }
      .mono { font: 600 12px 'Consolas', 'Courier New', monospace; fill: #334155; }
      .pin { font: 600 12px 'Segoe UI', Arial, sans-serif; fill: #e5e7eb; }
      .wire5 { stroke: #f97316; stroke-width: 4; fill: none; stroke-linecap: round; }
      .wire12 { stroke: #dc2626; stroke-width: 4.2; fill: none; stroke-linecap: round; }
      .wireG { stroke: #111827; stroke-width: 4.1; fill: none; stroke-linecap: round; }
      .wireI2C { stroke: #ca8a04; stroke-width: 3.6; fill: none; stroke-linecap: round; }
      .wireANA { stroke: #7c3aed; stroke-width: 3.8; fill: none; stroke-linecap: round; }
      .wireLOOP { stroke: #2563eb; stroke-width: 3.9; fill: none; stroke-linecap: round; }
      .railText { font: 700 12px 'Consolas', 'Courier New', monospace; fill: #0f172a; }
      .cut { fill: #ef4444; stroke: #7f1d1d; stroke-width: 1; }
      .node { fill: #ef4444; stroke: #7f1d1d; stroke-width: 1; }
    </style>
  </defs>

  <rect x="0" y="0" width="1800" height="1160" fill="url(#bg)"/>
  <text x="34" y="52" class="h1">Realistischer Loetplan V3 - clean routing</text>
  <text x="34" y="80" class="h2">Streifenraster 75 x 100 mm | nur orthogonale Leitungen | feste Routing-Kanaele mit senkrechten Bruecken</text>

  <!-- Board -->
  <g filter="url(#shadow)">
    <rect x="34" y="106" width="1320" height="980" rx="14" ry="14" fill="url(#board)" stroke="#7b5c35" stroke-width="2.2"/>
    <rect x="66" y="142" width="1256" height="910" fill="url(#strips)" opacity="0.45"/>
    <rect x="66" y="142" width="1256" height="910" fill="url(#holes)"/>
  </g>

  <!-- axes -->
  <text x="72" y="130" class="h3">Raster 30 x 39, Pitch 2.54 mm, Leiterbahnen horizontal</text>
  <text x="48" y="176" class="mono">A</text>
  <text x="48" y="272" class="mono">E</text>
  <text x="48" y="368" class="mono">I</text>
  <text x="48" y="464" class="mono">M</text>
  <text x="48" y="560" class="mono">Q</text>
  <text x="48" y="656" class="mono">U</text>
  <text x="48" y="752" class="mono">Y</text>
  <text x="40" y="848" class="mono">AC</text>
  <text x="40" y="944" class="mono">AG</text>

  <!-- Modules -->
  <g filter="url(#shadow)">
    <rect x="900" y="230" width="330" height="230" rx="10" ry="10" fill="url(#mod)" stroke="#123453" stroke-width="2"/>
    <text x="924" y="262" class="pin">D1 Mini</text>
    <text x="924" y="286" class="pin">Pins in use: D1 D2 3V3 5V GND</text>
    <text x="924" y="310" class="pin">Service: RST A0 D0 D3 D4 D5 D6 D7 D8 TX RX</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="650" y="240" width="200" height="280" rx="10" ry="10" fill="url(#mod)" stroke="#123453" stroke-width="2"/>
    <text x="672" y="272" class="pin">ADS1115</text>
    <text x="672" y="296" class="pin">VDD GND SCL SDA ADDR</text>
    <text x="672" y="320" class="pin">A0 used, ALRT/A1/A2/A3 service</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="430" y="560" width="430" height="260" rx="10" ry="10" fill="url(#mod)" stroke="#123453" stroke-width="2"/>
    <text x="456" y="592" class="pin">4-20mA Receiver</text>
    <text x="456" y="616" class="pin">VCC VOUT GND and I+ I- (J1 as module config)</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="160" y="620" width="230" height="340" rx="10" ry="10" fill="url(#mod)" stroke="#123453" stroke-width="2"/>
    <text x="196" y="656" class="pin">XL6009 Boost</text>
    <text x="196" y="680" class="pin">IN+ IN- OUT+ OUT-</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="900" y="700" width="300" height="146" rx="10" ry="10" fill="#bdebd8" stroke="#2f855a" stroke-width="2"/>
    <text x="926" y="734" class="h3" fill="#14532d">Sensor Klemme</text>
    <text x="926" y="762" class="txt" fill="#14532d">Braun (+12V)</text>
    <text x="926" y="790" class="txt" fill="#14532d">Blau (Loop -)</text>
  </g>

  <!-- Fixed routing channels (horizontal rails) -->
  <line x1="86" y1="320" x2="1300" y2="320" class="wire12"/>
  <text x="1290" y="314" class="railText" text-anchor="end">3V3_RAIL</text>

  <line x1="86" y1="352" x2="1300" y2="352" class="wireI2C"/>
  <text x="1290" y="346" class="railText" text-anchor="end">I2C_SCL_RAIL</text>

  <line x1="86" y1="384" x2="1300" y2="384" class="wireI2C"/>
  <text x="1290" y="378" class="railText" text-anchor="end">I2C_SDA_RAIL</text>

  <line x1="86" y1="640" x2="1300" y2="640" class="wireANA"/>
  <text x="1290" y="634" class="railText" text-anchor="end">ANALOG_A0_RAIL</text>

  <line x1="86" y1="700" x2="1300" y2="700" class="wire5"/>
  <text x="1290" y="694" class="railText" text-anchor="end">5V_RAIL</text>

  <line x1="86" y1="732" x2="1300" y2="732" class="wireG"/>
  <text x="1290" y="726" class="railText" text-anchor="end">GND_RAIL</text>

  <line x1="86" y1="780" x2="1300" y2="780" class="wireLOOP"/>
  <text x="1290" y="774" class="railText" text-anchor="end">LOOP_RAIL</text>

  <line x1="86" y1="920" x2="1300" y2="920" class="wire12"/>
  <text x="1290" y="914" class="railText" text-anchor="end">12V_RAIL</text>

  <!-- Vertical drops only (between strips) -->
  <!-- D1 to rails -->
  <line x1="1120" y1="320" x2="1120" y2="460" class="wire12"/>
  <line x1="1090" y1="352" x2="1090" y2="460" class="wireI2C"/>
  <line x1="1060" y1="384" x2="1060" y2="460" class="wireI2C"/>
  <line x1="1030" y1="700" x2="1030" y2="460" class="wire5"/>
  <line x1="1000" y1="732" x2="1000" y2="460" class="wireG"/>

  <!-- ADS to rails -->
  <line x1="680" y1="320" x2="680" y2="520" class="wire12"/>
  <line x1="710" y1="352" x2="710" y2="520" class="wireG"/>
  <line x1="740" y1="352" x2="740" y2="520" class="wireI2C"/>
  <line x1="770" y1="384" x2="770" y2="520" class="wireI2C"/>
  <line x1="800" y1="732" x2="800" y2="520" class="wireG"/>
  <line x1="830" y1="640" x2="830" y2="520" class="wireANA"/>

  <!-- Receiver to rails -->
  <line x1="500" y1="920" x2="500" y2="560" class="wire12"/>
  <line x1="560" y1="640" x2="560" y2="560" class="wireANA"/>
  <line x1="620" y1="732" x2="620" y2="560" class="wireG"/>
  <line x1="680" y1="780" x2="680" y2="560" class="wireLOOP"/>
  <line x1="740" y1="732" x2="740" y2="560" class="wireG"/>

  <!-- Boost to rails -->
  <line x1="220" y1="700" x2="220" y2="960" class="wire5"/>
  <line x1="280" y1="732" x2="280" y2="960" class="wireG"/>
  <line x1="340" y1="920" x2="340" y2="960" class="wire12"/>
  <line x1="380" y1="732" x2="380" y2="960" class="wireG"/>

  <!-- Sensor terminal to rails -->
  <line x1="940" y1="920" x2="940" y2="846" class="wire12"/>
  <line x1="980" y1="780" x2="980" y2="846" class="wireLOOP"/>

  <!-- Nodes -->
  <g>
    <circle cx="1120" cy="320" r="5" class="node"/>
    <circle cx="1090" cy="352" r="5" class="node"/>
    <circle cx="1060" cy="384" r="5" class="node"/>
    <circle cx="1030" cy="700" r="5" class="node"/>
    <circle cx="1000" cy="732" r="5" class="node"/>

    <circle cx="680" cy="320" r="5" class="node"/>
    <circle cx="710" cy="352" r="5" class="node"/>
    <circle cx="740" cy="352" r="5" class="node"/>
    <circle cx="770" cy="384" r="5" class="node"/>
    <circle cx="800" cy="732" r="5" class="node"/>
    <circle cx="830" cy="640" r="5" class="node"/>

    <circle cx="500" cy="920" r="5" class="node"/>
    <circle cx="560" cy="640" r="5" class="node"/>
    <circle cx="620" cy="732" r="5" class="node"/>
    <circle cx="680" cy="780" r="5" class="node"/>
    <circle cx="740" cy="732" r="5" class="node"/>

    <circle cx="220" cy="700" r="5" class="node"/>
    <circle cx="280" cy="732" r="5" class="node"/>
    <circle cx="340" cy="920" r="5" class="node"/>
    <circle cx="380" cy="732" r="5" class="node"/>

    <circle cx="940" cy="920" r="5" class="node"/>
    <circle cx="980" cy="780" r="5" class="node"/>
  </g>

  <!-- Track cuts -->
  <circle cx="612" cy="320" r="7" class="cut"/>
  <circle cx="612" cy="352" r="7" class="cut"/>
  <circle cx="612" cy="384" r="7" class="cut"/>
  <circle cx="404" cy="640" r="7" class="cut"/>
  <circle cx="404" cy="700" r="7" class="cut"/>
  <circle cx="404" cy="780" r="7" class="cut"/>
  <circle cx="884" cy="640" r="7" class="cut"/>
  <circle cx="884" cy="700" r="7" class="cut"/>
  <circle cx="884" cy="780" r="7" class="cut"/>

  <!-- Right panel -->
  <g filter="url(#shadow)">
    <rect x="1376" y="106" width="392" height="980" rx="12" ry="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
    <text x="1400" y="144" class="h3">Saubere Routing-Regeln (V3)</text>
    <text x="1400" y="174" class="txt">1. Jeder Netztyp hat eine feste Horizontalbahn.</text>
    <text x="1400" y="198" class="txt">2. Modulanschluesse gehen nur senkrecht auf die Bahn.</text>
    <text x="1400" y="222" class="txt">3. Keine diagonalen Draehte im Plan.</text>
    <text x="1400" y="246" class="txt">4. Cuts sind separat rot markiert.</text>

    <text x="1400" y="296" class="h3">Netze</text>
    <text x="1400" y="324" class="txt">3V3: D1 -> ADS VDD</text>
    <text x="1400" y="348" class="txt">I2C: D1 D1/D2 -> ADS SCL/SDA</text>
    <text x="1400" y="372" class="txt">Analog: Receiver VOUT -> ADS A0</text>
    <text x="1400" y="396" class="txt">5V: D1 5V -> Boost IN+</text>
    <text x="1400" y="420" class="txt">12V: Boost OUT+ -> Sensor+ -> Receiver VCC</text>
    <text x="1400" y="444" class="txt">Loop: Sensor- -> Receiver I+</text>
    <text x="1400" y="468" class="txt">GND: alle GND/I- zusammen</text>

    <text x="1400" y="520" class="h3">Legende</text>
    <line x1="1402" y1="546" x2="1456" y2="546" class="wire12"/><text x="1466" y="551" class="txt">12V / 3V3</text>
    <line x1="1402" y1="572" x2="1456" y2="572" class="wire5"/><text x="1466" y="577" class="txt">5V</text>
    <line x1="1402" y1="598" x2="1456" y2="598" class="wireG"/><text x="1466" y="603" class="txt">GND</text>
    <line x1="1402" y1="624" x2="1456" y2="624" class="wireI2C"/><text x="1466" y="629" class="txt">I2C</text>
    <line x1="1402" y1="650" x2="1456" y2="650" class="wireANA"/><text x="1466" y="655" class="txt">Analog</text>
    <line x1="1402" y1="676" x2="1456" y2="676" class="wireLOOP"/><text x="1466" y="681" class="txt">4-20mA Loop</text>
    <circle cx="1428" cy="706" r="6" class="cut"/><text x="1466" y="711" class="txt">Track-Cut</text>
    <circle cx="1428" cy="734" r="5" class="node"/><text x="1466" y="739" class="txt">Loetknoten</text>

    <text x="1400" y="792" class="h3">Loetseite Hinweis</text>
    <text x="1400" y="820" class="txt">Kupferseite ist gespiegelt zur Bauteilseite.</text>
    <text x="1400" y="844" class="txt">Vor dem Loeten jede Bahn mit Durchgang pruefen.</text>
    <text x="1400" y="868" class="txt">Boost zuerst ohne Last auf 12.0V trimmen.</text>
  </g>

  <!-- Footer legend -->
  <g filter="url(#shadow)">
    <rect x="34" y="1102" width="1734" height="44" rx="8" ry="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <text x="52" y="1130" class="mono">V3 clean: nur senkrechte Bruecken zwischen den Bahnen, keine diagonalen Verbindungen</text>
  </g>
</svg>
