<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
  <defs>
    <style>
      .t { font-family: Arial, sans-serif; fill: #111827; }
      .h1 { font-size: 30px; font-weight: 700; }
      .h2 { font-size: 16px; font-weight: 500; fill: #4b5563; }
      .lab { font-size: 13px; font-weight: 700; }
      .pin { font-size: 12px; }
      .board { fill: #f3e4b8; stroke: #8b5e34; stroke-width: 2; }
      .grid { stroke: #b08968; stroke-width: 0.7; opacity: 0.45; }
      .mod { stroke: #334155; stroke-width: 2; rx: 10; ry: 10; }
      .d1 { fill: #fed7aa; }
      .ads { fill: #fef3c7; }
      .rx { fill: #ddd6fe; }
      .boost { fill: #bfdbfe; }
      .term { fill: #bbf7d0; }
      .n5 { stroke: #f97316; stroke-width: 4; fill: none; }
      .n12 { stroke: #dc2626; stroke-width: 4; fill: none; }
      .ng { stroke: #111827; stroke-width: 4; fill: none; }
      .ni2c { stroke: #ca8a04; stroke-width: 3.5; fill: none; }
      .na { stroke: #7c3aed; stroke-width: 3.5; fill: none; }
      .nl { stroke: #2563eb; stroke-width: 4; fill: none; }
      .cut { fill: #ef4444; stroke: #7f1d1d; stroke-width: 0.7; }
      .legend { fill: #fff; stroke: #94a3b8; stroke-width: 1.2; rx: 8; }
    </style>
  </defs>

  <text x="30" y="45" class="t h1">Veroboard 75x100 Full-Pin Layout (ESP8266 + ADS1115 + XL6009 + 4-20mA)</text>
  <text x="30" y="72" class="t h2">Alle Pins verlötet. Nicht genutzte Pins gehen auf Service-Pads. Horizontal strips = links/rechts.</text>

  <rect x="40" y="100" width="1520" height="940" class="board"/>

  <!-- grid -->
  <g>
    <line x1="120" y1="140" x2="120" y2="980" class="grid"/><line x1="170" y1="140" x2="170" y2="980" class="grid"/><line x1="220" y1="140" x2="220" y2="980" class="grid"/><line x1="270" y1="140" x2="270" y2="980" class="grid"/><line x1="320" y1="140" x2="320" y2="980" class="grid"/><line x1="370" y1="140" x2="370" y2="980" class="grid"/><line x1="420" y1="140" x2="420" y2="980" class="grid"/><line x1="470" y1="140" x2="470" y2="980" class="grid"/><line x1="520" y1="140" x2="520" y2="980" class="grid"/><line x1="570" y1="140" x2="570" y2="980" class="grid"/><line x1="620" y1="140" x2="620" y2="980" class="grid"/><line x1="670" y1="140" x2="670" y2="980" class="grid"/><line x1="720" y1="140" x2="720" y2="980" class="grid"/><line x1="770" y1="140" x2="770" y2="980" class="grid"/><line x1="820" y1="140" x2="820" y2="980" class="grid"/><line x1="870" y1="140" x2="870" y2="980" class="grid"/><line x1="920" y1="140" x2="920" y2="980" class="grid"/><line x1="970" y1="140" x2="970" y2="980" class="grid"/><line x1="1020" y1="140" x2="1020" y2="980" class="grid"/><line x1="1070" y1="140" x2="1070" y2="980" class="grid"/><line x1="1120" y1="140" x2="1120" y2="980" class="grid"/><line x1="1170" y1="140" x2="1170" y2="980" class="grid"/><line x1="1220" y1="140" x2="1220" y2="980" class="grid"/><line x1="1270" y1="140" x2="1270" y2="980" class="grid"/><line x1="1320" y1="140" x2="1320" y2="980" class="grid"/><line x1="1370" y1="140" x2="1370" y2="980" class="grid"/><line x1="1420" y1="140" x2="1420" y2="980" class="grid"/>
    <line x1="120" y1="140" x2="1420" y2="140" class="grid"/><line x1="120" y1="180" x2="1420" y2="180" class="grid"/><line x1="120" y1="220" x2="1420" y2="220" class="grid"/><line x1="120" y1="260" x2="1420" y2="260" class="grid"/><line x1="120" y1="300" x2="1420" y2="300" class="grid"/><line x1="120" y1="340" x2="1420" y2="340" class="grid"/><line x1="120" y1="380" x2="1420" y2="380" class="grid"/><line x1="120" y1="420" x2="1420" y2="420" class="grid"/><line x1="120" y1="460" x2="1420" y2="460" class="grid"/><line x1="120" y1="500" x2="1420" y2="500" class="grid"/><line x1="120" y1="540" x2="1420" y2="540" class="grid"/><line x1="120" y1="580" x2="1420" y2="580" class="grid"/><line x1="120" y1="620" x2="1420" y2="620" class="grid"/><line x1="120" y1="660" x2="1420" y2="660" class="grid"/><line x1="120" y1="700" x2="1420" y2="700" class="grid"/><line x1="120" y1="740" x2="1420" y2="740" class="grid"/><line x1="120" y1="780" x2="1420" y2="780" class="grid"/><line x1="120" y1="820" x2="1420" y2="820" class="grid"/><line x1="120" y1="860" x2="1420" y2="860" class="grid"/><line x1="120" y1="900" x2="1420" y2="900" class="grid"/><line x1="120" y1="940" x2="1420" y2="940" class="grid"/><line x1="120" y1="980" x2="1420" y2="980" class="grid"/>
  </g>

  <!-- modules -->
  <rect x="980" y="180" width="360" height="260" class="mod d1"/>
  <text x="1000" y="210" class="t lab">D1 Mini (alle 16 Pins verlötet)</text>
  <text x="1000" y="235" class="t pin">Aktiv: D1,D2,3V3,5V,G | Service: RST,A0,D0,D3..D8,TX,RX</text>

  <rect x="690" y="210" width="240" height="220" class="mod ads"/>
  <text x="710" y="240" class="t lab">ADS1115</text>
  <text x="710" y="265" class="t pin">Aktiv: VDD,GND,SCL,SDA,ADDR,A0</text>
  <text x="710" y="285" class="t pin">Service: ALRT,A1,A2,A3</text>

  <rect x="500" y="520" width="360" height="260" class="mod rx"/>
  <text x="520" y="550" class="t lab">4-20mA Receiver</text>
  <text x="520" y="575" class="t pin">VCC,VOUT,GND,I+,I-, J1(1..4)</text>

  <rect x="170" y="610" width="260" height="220" class="mod boost"/>
  <text x="190" y="640" class="t lab">XL6009 Boost</text>
  <text x="190" y="665" class="t pin">IN+, IN-, OUT+, OUT-</text>

  <rect x="980" y="640" width="220" height="120" class="mod term"/>
  <text x="1000" y="670" class="t lab">Sensor Klemme</text>
  <text x="1000" y="695" class="t pin">Braun(+), Blau(-)</text>

  <rect x="1240" y="520" width="220" height="280" class="mod" fill="#ffffff"/>
  <text x="1260" y="550" class="t lab">Service-Pads</text>
  <text x="1260" y="575" class="t pin">RST A0 D0 D3 D4 D5</text>
  <text x="1260" y="595" class="t pin">D6 D7 D8 TX RX</text>
  <text x="1260" y="615" class="t pin">ALRT A1 A2 A3 GND</text>

  <!-- nets -->
  <path d="M1120 440 L1120 700 L430 700" class="n5"/>
  <text x="1130" y="640" class="t pin">5V_BUS</text>

  <path d="M1090 440 L1090 730 L430 730" class="ng"/>
  <text x="930" y="748" class="t pin">GND_BUS</text>

  <path d="M430 760 L980 760" class="n12"/>
  <text x="650" y="750" class="t pin">12V_BUS</text>

  <path d="M1200 700 L860 700 L860 610" class="nl"/>
  <text x="1050" y="720" class="t pin">LOOP_IN</text>

  <path d="M860 580 L690 580 L690 320" class="na"/>
  <text x="700" y="565" class="t pin">ANALOG_IN: VOUT -> A0</text>

  <path d="M860 620 L940 620 L940 300 L980 300" class="ni2c"/>
  <text x="948" y="292" class="t pin">I2C_SCL</text>

  <path d="M860 650 L960 650 L960 340 L980 340" class="ni2c"/>
  <text x="968" y="332" class="t pin">I2C_SDA</text>

  <path d="M930 270 L980 380" class="n12"/>
  <text x="920" y="330" class="t pin">3V3_BUS</text>

  <!-- cuts -->
  <circle cx="660" cy="300" r="6" class="cut"/><circle cx="660" cy="340" r="6" class="cut"/><circle cx="660" cy="380" r="6" class="cut"/>
  <circle cx="470" cy="580" r="6" class="cut"/><circle cx="470" cy="620" r="6" class="cut"/><circle cx="470" cy="660" r="6" class="cut"/>
  <circle cx="900" cy="580" r="6" class="cut"/><circle cx="900" cy="620" r="6" class="cut"/><circle cx="900" cy="660" r="6" class="cut"/>
  <text x="610" y="820" class="t pin">Rot = Leiterbahn trennen (Strip-Cut) und mit Multimeter prüfen.</text>

  <!-- legend -->
  <rect x="80" y="860" width="500" height="150" class="legend"/>
  <text x="100" y="890" class="t lab">Legende</text>
  <line x1="100" y1="915" x2="150" y2="915" class="n12"/><text x="165" y="920" class="t pin">12V / 3V3</text>
  <line x1="240" y1="915" x2="290" y2="915" class="n5"/><text x="305" y="920" class="t pin">5V</text>
  <line x1="360" y1="915" x2="410" y2="915" class="ng"/><text x="425" y="920" class="t pin">GND</text>
  <line x1="100" y1="950" x2="150" y2="950" class="ni2c"/><text x="165" y="955" class="t pin">I2C</text>
  <line x1="240" y1="950" x2="290" y2="950" class="na"/><text x="305" y="955" class="t pin">Analog 0..3.3V</text>
  <line x1="420" y1="950" x2="470" y2="950" class="nl"/><text x="485" y="955" class="t pin">4-20mA Loop</text>
</svg>
