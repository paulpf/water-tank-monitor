<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1300" viewBox="0 0 1800 1300">
  <defs>
    <style>
      .t{font-family:Segoe UI,Arial,sans-serif;fill:#0f172a}
      .h1{font-size:30px;font-weight:700}
      .h2{font-size:16px;fill:#475569}
      .sec{font-size:20px;font-weight:700}
      .lab{font-size:13px;font-weight:700}
      .txt{font-size:12px}
      .small{font-size:11px;fill:#334155}
      .boardTop{fill:#f3e8c3;stroke:#8b5e34;stroke-width:2}
      .boardBot{fill:#f0dfb0;stroke:#8b5e34;stroke-width:2}
      .strip{stroke:#b87333;stroke-width:12;stroke-linecap:round}
      .hole{fill:#fefcf4;stroke:#7c5b3c;stroke-width:1}
      .mod{stroke:#334155;stroke-width:2;rx:10;ry:10}
      .d1{fill:#fed7aa}
      .ads{fill:#fef3c7}
      .rx{fill:#ddd6fe}
      .boost{fill:#bfdbfe}
      .term{fill:#bbf7d0}
      .svc{fill:#f3f4f6}
      .cut{fill:#ef4444;stroke:#7f1d1d;stroke-width:1}
      .n12{stroke:#dc2626;stroke-width:4;fill:none}
      .n5{stroke:#f97316;stroke-width:4;fill:none}
      .ng{stroke:#111827;stroke-width:4;fill:none}
      .ni2c{stroke:#ca8a04;stroke-width:4;fill:none}
      .na{stroke:#7c3aed;stroke-width:4;fill:none}
      .nl{stroke:#2563eb;stroke-width:4;fill:none}
      .legend{fill:#fff;stroke:#94a3b8;stroke-width:1.2}
      .coord{font-size:10px;fill:#475569;font-family:Consolas,monospace}
    </style>
  </defs>

  <text x="28" y="42" class="t h1">Veroboard 75x100 – realistischer Lötplan (deine Hardware)</text>
  <text x="28" y="68" class="t h2">Oben: Bauteilseite. Unten: Lötseite mit Kupferstreifen, Cuts und Drahtbrücken. Alle Signalpins berücksichtigt.</text>

  <!-- TOP / COMPONENT SIDE -->
  <text x="28" y="102" class="t sec">Bauteilseite (Bestückung)</text>
  <rect x="28" y="116" width="1744" height="500" class="boardTop"/>

  <rect x="1100" y="170" width="430" height="220" class="mod d1"/>
  <text x="1120" y="202" class="t lab">D1 Mini (ESP8266)</text>
  <text x="1120" y="226" class="t txt">Aktiv: D1(SCL), D2(SDA), 3V3, 5V, GND</text>
  <text x="1120" y="246" class="t txt">Service: RST, A0, D0, D3, D4, D5, D6, D7, D8, TX, RX</text>

  <rect x="760" y="180" width="280" height="190" class="mod ads"/>
  <text x="780" y="212" class="t lab">ADS1115</text>
  <text x="780" y="236" class="t txt">VDD, GND, SCL, SDA, ADDR, A0</text>
  <text x="780" y="256" class="t txt">Service: ALRT, A1, A2, A3</text>

  <rect x="520" y="370" width="520" height="210" class="mod rx"/>
  <text x="540" y="402" class="t lab">4-20 mA Receiver</text>
  <text x="540" y="426" class="t txt">VCC, VOUT, GND, I+, I-, J1(1..4)</text>

  <rect x="140" y="390" width="320" height="200" class="mod boost"/>
  <text x="160" y="422" class="t lab">XL6009 Boost</text>
  <text x="160" y="446" class="t txt">IN+, IN-, OUT+, OUT-</text>

  <rect x="1260" y="420" width="280" height="170" class="mod svc"/>
  <text x="1280" y="452" class="t lab">Service-Pads</text>
  <text x="1280" y="476" class="t txt">RST, A0, D0, D3, D4, D5, D6, D7, D8, TX, RX</text>
  <text x="1280" y="496" class="t txt">ALRT, A1, A2, A3, GND</text>

  <rect x="1080" y="420" width="160" height="170" class="mod term"/>
  <text x="1100" y="452" class="t lab">Sensor-Klemme</text>
  <text x="1100" y="476" class="t txt">Braun(+) -> 12V</text>
  <text x="1100" y="496" class="t txt">Blau(-) -> I+</text>

  <!-- BOTTOM / SOLDER SIDE -->
  <text x="28" y="660" class="t sec">Lötseite (Kupferseite, fürs Löten maßgeblich)</text>
  <rect x="28" y="674" width="1744" height="590" class="boardBot"/>

  <!-- horizontal strips -->
  <g>
    <line x1="90" y1="730" x2="1710" y2="730" class="strip"/>
    <line x1="90" y1="770" x2="1710" y2="770" class="strip"/>
    <line x1="90" y1="810" x2="1710" y2="810" class="strip"/>
    <line x1="90" y1="850" x2="1710" y2="850" class="strip"/>
    <line x1="90" y1="890" x2="1710" y2="890" class="strip"/>
    <line x1="90" y1="930" x2="1710" y2="930" class="strip"/>
    <line x1="90" y1="970" x2="1710" y2="970" class="strip"/>
    <line x1="90" y1="1010" x2="1710" y2="1010" class="strip"/>
    <line x1="90" y1="1050" x2="1710" y2="1050" class="strip"/>
    <line x1="90" y1="1090" x2="1710" y2="1090" class="strip"/>
    <line x1="90" y1="1130" x2="1710" y2="1130" class="strip"/>
    <line x1="90" y1="1170" x2="1710" y2="1170" class="strip"/>
    <line x1="90" y1="1210" x2="1710" y2="1210" class="strip"/>
  </g>

  <!-- coordinate labels -->
  <text x="60" y="734" class="coord">R1</text><text x="60" y="774" class="coord">R2</text><text x="60" y="814" class="coord">R3</text>
  <text x="60" y="854" class="coord">R4</text><text x="60" y="894" class="coord">R5</text><text x="60" y="934" class="coord">R6</text>
  <text x="60" y="974" class="coord">R7</text><text x="60" y="1014" class="coord">R8</text><text x="60" y="1054" class="coord">R9</text>
  <text x="60" y="1094" class="coord">R10</text><text x="60" y="1134" class="coord">R11</text><text x="60" y="1174" class="coord">R12</text>
  <text x="60" y="1214" class="coord">R13</text>
  <text x="110" y="1252" class="coord">C1</text><text x="310" y="1252" class="coord">C5</text><text x="510" y="1252" class="coord">C9</text>
  <text x="710" y="1252" class="coord">C13</text><text x="910" y="1252" class="coord">C17</text><text x="1110" y="1252" class="coord">C21</text>
  <text x="1310" y="1252" class="coord">C25</text><text x="1510" y="1252" class="coord">C29</text><text x="1670" y="1252" class="coord">C32</text>

  <!-- holes (selected markers to keep file lightweight but realistic) -->
  <g>
    <circle cx="120" cy="730" r="3.7" class="hole"/><circle cx="170" cy="730" r="3.7" class="hole"/><circle cx="220" cy="730" r="3.7" class="hole"/><circle cx="270" cy="730" r="3.7" class="hole"/><circle cx="320" cy="730" r="3.7" class="hole"/><circle cx="370" cy="730" r="3.7" class="hole"/><circle cx="420" cy="730" r="3.7" class="hole"/><circle cx="470" cy="730" r="3.7" class="hole"/><circle cx="520" cy="730" r="3.7" class="hole"/><circle cx="570" cy="730" r="3.7" class="hole"/><circle cx="620" cy="730" r="3.7" class="hole"/><circle cx="670" cy="730" r="3.7" class="hole"/><circle cx="720" cy="730" r="3.7" class="hole"/><circle cx="770" cy="730" r="3.7" class="hole"/><circle cx="820" cy="730" r="3.7" class="hole"/><circle cx="870" cy="730" r="3.7" class="hole"/><circle cx="920" cy="730" r="3.7" class="hole"/><circle cx="970" cy="730" r="3.7" class="hole"/><circle cx="1020" cy="730" r="3.7" class="hole"/><circle cx="1070" cy="730" r="3.7" class="hole"/><circle cx="1120" cy="730" r="3.7" class="hole"/><circle cx="1170" cy="730" r="3.7" class="hole"/><circle cx="1220" cy="730" r="3.7" class="hole"/><circle cx="1270" cy="730" r="3.7" class="hole"/><circle cx="1320" cy="730" r="3.7" class="hole"/><circle cx="1370" cy="730" r="3.7" class="hole"/><circle cx="1420" cy="730" r="3.7" class="hole"/><circle cx="1470" cy="730" r="3.7" class="hole"/><circle cx="1520" cy="730" r="3.7" class="hole"/><circle cx="1570" cy="730" r="3.7" class="hole"/><circle cx="1620" cy="730" r="3.7" class="hole"/><circle cx="1670" cy="730" r="3.7" class="hole"/>
  </g>

  <!-- cuts -->
  <circle cx="700" cy="810" r="8" class="cut"/><circle cx="700" cy="850" r="8" class="cut"/><circle cx="700" cy="890" r="8" class="cut"/>
  <circle cx="500" cy="970" r="8" class="cut"/><circle cx="500" cy="1010" r="8" class="cut"/><circle cx="500" cy="1050" r="8" class="cut"/>
  <circle cx="980" cy="970" r="8" class="cut"/><circle cx="980" cy="1010" r="8" class="cut"/><circle cx="980" cy="1050" r="8" class="cut"/>

  <!-- nets on solder side -->
  <path d="M980 970 L1060 970 L1060 850 L1140 850" class="ni2c"/>
  <path d="M980 1010 L1085 1010 L1085 890 L1140 890" class="ni2c"/>
  <path d="M980 930 L760 930 L760 770" class="na"/>

  <path d="M1260 930 L1260 1130 L420 1130" class="n5"/>
  <path d="M1210 930 L1210 1170 L420 1170" class="ng"/>
  <path d="M420 1210 L1100 1210" class="n12"/>
  <path d="M1100 1250 L980 1250 L980 1010" class="nl"/>

  <text x="1080" y="835" class="small">I2C_SCL</text>
  <text x="1090" y="875" class="small">I2C_SDA</text>
  <text x="790" y="918" class="small">ANALOG: VOUT -> ADS A0</text>
  <text x="1270" y="1118" class="small">5V_BUS</text>
  <text x="1218" y="1158" class="small">GND_BUS</text>
  <text x="760" y="1198" class="small">12V_BUS</text>
  <text x="1000" y="1240" class="small">LOOP_IN</text>

  <!-- legend -->
  <rect x="1420" y="980" width="320" height="260" class="legend"/>
  <text x="1440" y="1010" class="t lab">Legende</text>
  <line x1="1440" y1="1034" x2="1500" y2="1034" class="n12"/><text x="1512" y="1039" class="small">12V / 3V3</text>
  <line x1="1440" y1="1060" x2="1500" y2="1060" class="n5"/><text x="1512" y="1065" class="small">5V</text>
  <line x1="1440" y1="1086" x2="1500" y2="1086" class="ng"/><text x="1512" y="1091" class="small">GND</text>
  <line x1="1440" y1="1112" x2="1500" y2="1112" class="ni2c"/><text x="1512" y="1117" class="small">I2C Brücke</text>
  <line x1="1440" y1="1138" x2="1500" y2="1138" class="na"/><text x="1512" y="1143" class="small">Analog Brücke</text>
  <line x1="1440" y1="1164" x2="1500" y2="1164" class="nl"/><text x="1512" y="1169" class="small">Loop Brücke</text>
  <circle cx="1470" cy="1190" r="8" class="cut"/><text x="1488" y="1195" class="small">Cut (Trennschnitt)</text>
  <text x="1440" y="1220" class="small">Hinweis: J1 am 4-20mA-Modul gemäß Moduldoku setzen.</text>
</svg>
