; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Minimal WiFi + OTA template
default_envs = d1-mini-usb

[env:d1-mini-usb]
platform = espressif8266
board = d1_mini
framework = arduino
monitor_speed = 115200
build_flags =
  -I src/app
  -I src/config
  -I src/contracts
  -I src/domain
  -I src/infrastructure
  -I ../_secrets

lib_deps = 
  ArduinoOTA

[env:d1-mini-ota]
platform = espressif8266
board = d1_mini
framework = arduino
monitor_speed = 115200
upload_protocol = espota
; Upload port: Set IP address of ESP8266 here or pass via CLI: -o upload_port=192.168.X.X
; Default keeps `pio run -e d1-mini-ota` buildable without explicit --upload-port.
; For real OTA uploads, pass the device IP via CLI or use scripts/upload_ota.ps1.
upload_port = 0.0.0.0
build_flags =
  -I src/app
  -I src/config
  -I src/contracts
  -I src/domain
  -I src/infrastructure
  -I ../_secrets

lib_deps = 
  ArduinoOTA

[env:native]
platform = native
test_framework = unity
test_build_src = false
build_flags =
  -I src/domain
